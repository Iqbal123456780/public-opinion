
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Category News | Public Opinion News</title>

  <meta name="description"
        content="Explore the latest news and updates by category from Public Opinion News.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card h3 {
      margin-top: 0;
      color: #111827;
    }

    .card p {
      line-height: 1.6;
      color: #4b5563;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      background: #d71920;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    a:hover {
      background: #b9151b;
    }

    .back-link {
      background: #111827;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1 id="catTitle">Category News</h1>
</header>

<main class="container">

  <a class="back-link" href="index.html">
    ← Back to Homepage
  </a>

  <div id="news"></div>

</main>

<script>
"use strict";

// Read the category from the URL.
const params = new URLSearchParams(window.location.search);
const requestedCategory = params.get("cat");

// Only allow known categories.
const allowedCategories = {
  politics: "Politics",
  world: "World",
  business: "Business",
  sports: "Sports"
};

// Validate the requested category.
const categoryKey = (requestedCategory || "").toLowerCase();

const categoryName =
  allowedCategories[categoryKey] || "Latest";

// Update the page title safely.
document.getElementById("catTitle").textContent =
  categoryName + " News";

// Get the news container.
const newsContainer = document.getElementById("news");

// Create news cards using safe DOM methods.
function createNewsCard(title, description) {

  const card = document.createElement("div");
  card.className = "card";

  const heading = document.createElement("h3");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = description;

  const link = document.createElement("a");

  const articleParams = new URLSearchParams();
  articleParams.set("title", title);

  link.href = "article.html?" + articleParams.toString();
  link.textContent = "Read More";

  card.appendChild(heading);
  card.appendChild(paragraph);
  card.appendChild(link);

  return card;
}

// Display category news.
newsContainer.appendChild(
  createNewsCard(
    categoryName + " Breaking News 1",
    "Latest updates in " + categoryName +
    " are developing. Stay connected with Public Opinion News."
  )
);

newsContainer.appendChild(
  createNewsCard(
    categoryName + " Update 2",
    "Important news and developments in the " +
    categoryName + " category."
  )
);

</script>

</body>
</html>
