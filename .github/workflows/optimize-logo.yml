name: Optimize logo and deploy site

on:
  push:
    branches:
      - main
    paths:
      - optimize_logo.py

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: logo-optimization-deployment
  cancel-in-progress: false

jobs:
  optimize-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --upgrade Pillow

      - name: Create optimized logo and update image references
        run: python optimize_logo.py

      - name: Commit optimized logo references
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No logo or reference changes were needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Serve optimized WebP logo across the site"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
