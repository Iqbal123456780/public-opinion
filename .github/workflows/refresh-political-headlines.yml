name: Refresh Pakistan Political Headlines

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour to reduce queue congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-political-headlines
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build source-linked political headlines
        run: python scripts/update_breaking_news.py

      - name: Commit feed when it changes
        run: |
          if git diff --quiet -- breaking-news.json; then
            echo "No headline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breaking-news.json
          git commit -m "Refresh Pakistan political headlines"
          git push
